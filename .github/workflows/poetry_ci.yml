# .github/workflows/poetry_ci.yml

name: Poetry CI/CD to AWS ECR

on:
  push:
    branches:
      - feat/**
      - main 
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write

concurrency:
  group: ecr-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: eu-west-2
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  TRIVY_REPORT_FORMAT: cyclonedx
  TRIVY_REPORT_OUTPUT_PATH: trivy-sbom-image.cdx.json

jobs:

  ##########################################################################
  # Typing
  ##########################################################################
  typing:
    name: MyPy Typing Analysis

    runs-on: ubuntu-latest

    container:
      image: python:3.12

    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup certificates
        run: |
          mkdir -p /etc/ssl/certs
          cp ./certs/dev-ca.cer /etc/ssl/certs/dev-ca.cer

      - name: Configure pip
        run: |
          cat <<EOF > /etc/pip.conf
          [global]
          index = https://nexus.dev.net/repository/PyPI-Official
          index-url = https://nexus.dev.net/repository/PyPI-Official/simple
          extra-index-url = https://nexus.dev.net/repository/owpypi/simple
          cert = /etc/ssl/certs/dev-ca.cer
          no-cache-dir = false
          trusted-host = nexus.dev.net
          EOF

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Configure Poetry
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          poetry config virtualenvs.in-project true

          poetry config repositories.ow-pypi \
            https://nexus.dev.net/repository/ow-pypi/simple

          poetry config http-basic.ow-pypi \
            $NEXUS_USER \
            $NEXUS_PASSWORD

          poetry config certificates.ow-pypi.cert \
            /etc/ssl/certs/dev-ca.cer

          poetry install --all-extras

      - name: Run MyPy
        run: |
          poetry run mypy -v src/

  ##########################################################################
  # Tests
  ##########################################################################
  tests:
    name: Pytest

    runs-on: ubuntu-latest

    container:
      image: python:3.12

    steps:
      - uses: actions/checkout@v4

      - name: Setup certificates
        run: |
          mkdir -p /etc/ssl/certs
          cp certs/dev-ca.cer /etc/ssl/certs/dev-ca.cer

      - name: Configure pip
        run: |
          cat <<EOF > /etc/pip.conf
          [global]
          index = https://nexus.dev.net/repository/PyPI-Official
          index-url = https://nexus.dev.net/repository/PyPI-Official/simple
          extra-index-url = https://nexus.dev.net/repository/owpypi/simple
          cert = /etc/ssl/certs/dev-ca.cer
          trusted-host = nexus.dev.net
          EOF

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          poetry config virtualenvs.in-project true

          poetry config repositories.ow-pypi \
            https://nexus.dev.net/repository/ow-pypi/simple

          poetry config http-basic.ow-pypi \
            $NEXUS_USER \
            $NEXUS_PASSWORD

          poetry install --all-extras

      - name: Run tests
        run: |
          poetry run pytest \
            --cov-report html \
            --cov-report term \
            --cov-report xml \
            --junitxml=tests-junit.xml \
            --cov=src/ \
            tests/

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            htmlcov/
            tests-junit.xml
            coverage.xml

  ##########################################################################
  # Semgrep
  ##########################################################################
  semgrep:
    name: Semgrep Scan

    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      SEMGREP_REPO_NAME: ${{ github.repository }}
      SEMGREP_BRANCH: ${{ github.head_ref != '' && github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Semgrep
        uses: actions/cache@v4
        with:
          path: ~/.cache/semgrep
          key: semgrep-${{ runner.os }}-v1

      - name: Run Semgrep
        run: semgrep ci

  ##########################################################################
  # Docker Build
  ##########################################################################
  build-image:
    name: Build Docker Image
    needs:
     - semgrep

    runs-on: ubuntu-latest
    outputs:
       image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag  }}
            
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  ##########################################################################
  # Publish Python Package
  ##########################################################################
  publish:
    name: Publish Package

    runs-on: ubuntu-latest

    container:
      image: python:3.12

    needs:
      - tests
      - typing
      - semgrep
      - trivy
      - dependency-track

    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          poetry config virtualenvs.in-project true

          poetry config repositories.owpypi \
            https://nexus.dev.net/repository/owpypi/

          poetry config http-basic.owpypi \
            $NEXUS_USER \
            $NEXUS_PASSWORD

          poetry install --all-extras

      - name: Publish package
        run: |
          poetry publish --build -r owpypi

  ##########################################################################
  # Trivy
  ##########################################################################
  trivy:
    name: Trivy Scan

    runs-on: ubuntu-latest

    needs:
      - build-image

    if: github.ref == 'refs/heads/main'

    container:
      image: aquasec/trivy:latest

    steps:
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-v1

      - name: Generate SBOM
        run: |
          trivy image \
            --format "${TRIVY_REPORT_FORMAT}" \
            --output "${TRIVY_REPORT_OUTPUT_PATH}" \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-image.outputs.image_tag }}

      - name: Scan image
        run: |
          trivy image \
            --skip-db-update \
            --skip-java-db-update \
            --severity HIGH,CRITICAL \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-image.outputs.image_tag }}

      - name: Enforce security gate
        run: |
          trivy image \
            --skip-db-update \
            --skip-java-db-update \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-image.outputs.image_tag }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom
          path: trivy-sbom-image.cdx.json
          retention-days: 30

  ##########################################################################
  # Dependency Track
  ##########################################################################
  dependency-track:
    name: Dependency Track Upload

    runs-on: ubuntu-latest

    needs:
      - trivy

    if: github.ref == 'refs/heads/main'

    container:
      image: docker:24.0.5-cli

    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: trivy-sbom
          path: .

      - name: Upload to Dependency Track
        env:
          DEPENDENCY_URL: ${{ secrets.DEPENDENCY_URL }}
          TRACK_API_KEY: ${{ secrets.TRACK_API_KEY }}
        run: |
          curl -X PUT "http://${DEPENDENCY_URL}/api/v1/bom" \
            -H "X-Api-Key: ${TRACK_API_KEY}" \
            -F "bom=@trivy-sbom-image.cdx.json" \
            -F "project=${{ github.event.repository.name }}" \
            -F "projectVersion=${{ github.ref_name }}"